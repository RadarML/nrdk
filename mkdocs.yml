site_name: Neural Radar Development Kit
repo_url: https://github.com/RadarML/nrdk
repo_name: RadarML/nrdk
site_url: https://radarml.github.io/nrdk/
nav:
  - nrdk:
    - Overview: index.md
    - Software Architecture: design.md
    - Core Modules:
      - nrdk.config: nrdk/config.md
      - nrdk.framework: nrdk/framework.md
      - nrdk.metrics: nrdk/metrics.md
      - nrdk.models: nrdk/models.md
      - nrdk.modules: nrdk/modules.md
      - nrdk.objectives: nrdk/objectives.md
      - nrdk.roverd: nrdk/roverd.md
      - nrdk.vis: nrdk/vis.md
  - cli: cli.md
  - nrdk.tss:
    - Overview: tss/index.md
    - High Level API: tss/api.md
    - Stats: tss/stats.md
    - Utils: tss/utils.md
  - grt:
    - Overview: grt/index.md
    - Models: grt/models.md
    - Configuration: grt/config.md


extra_css:
  - stylesheets/extra.css

theme:
  name: material
  custom_dir: docs/overrides
  icon:
    logo: octicons/ai-model-16
    annotation: material/arrow-right-circle
  font:
    code: monospace
  features:
    - navigation.instant
    - navigation.expand
    - navigation.tabs
  palette:
  - media: "(prefers-color-scheme)"
    toggle:
      icon: material/brightness-auto
      name: Switch to light mode
  - media: "(prefers-color-scheme: light)"
    scheme: default
    primary: green
    accent: blue
    toggle:
      icon: material/weather-sunny
      name: Switch to dark mode
  - media: "(prefers-color-scheme: dark)"
    scheme: slate
    primary: green
    accent: blue
    toggle:
      icon: material/weather-night
      name: Switch to system preference


plugins:
- search
- autorefs
- llmstxt:
    full_output: llms-full.txt
    markdown_description: |
      The Neural Radar Development Kit (NRDK) is a python library and framework
      for developing, training, and evaluating machine learning models on radar
      spectrum and multimodal sensor data. Built on pytorch lightning, hydra,
      and the abstract dataloader, it provides a modular, dependency
      injection-based training framework, a model zoo and reusable pytorch
      modules, training objectives and metrics, data loading for red-rover
      datasets, statistical testing for time series metrics, and a full
      reference implementation (GRT) to use as a project template.
    sections:
      "nrdk":
      - index.md: Project overview, installation, and getting started
      - design.md: Software architecture of the framework and its dependency injection-based component model
      - nrdk/config.md: Configuration utilities for simplifying hydra configurations
      - nrdk/framework.md: Pytorch lightning framework components (NRDKLightningModule, tokenizer/encoder/decoder models, callbacks)
      - nrdk/metrics.md: Reusable evaluation metrics beyond what is included in standard libraries
      - nrdk/models.md: Model zoo of stable, reusable models
      - nrdk/modules.md: General purpose pytorch modules with n-dimensional support
      - nrdk/objectives.md: Training objectives following the abstract dataloader objective specification
      - nrdk/roverd.md: Data loading and transforms for roverd datasets
      - nrdk/vis.md: General purpose visualization utilities
      "cli":
      - cli.md: Command line tools for working with NRDK output conventions (export, inspect, upgrade-config)
      "nrdk.tss":
      - tss/index.md: Statistical testing for time-correlated, finite-sample time series performance metrics
      - tss/api.md: High level API for indexing, loading, and comparing evaluation metrics
      - tss/stats.md: Effective sample size-corrected statistical tests
      - tss/utils.md: Utilities for loading and manipulating time series metrics
      "grt":
      - grt/index.md: GRT reference implementation and project template
      - grt/models.md: Models used by the GRT reference implementation
      - grt/config.md: Hydra configuration groups included in the reference training script
- mkdocstrings:
    default_handler: python_xref
    handlers:
      python_xref:
        paths:
        - src
        - grt
        options:
          docstring_style: google
          relative_crossrefs: true
          separate_signature: true
          line_length: 80
          show_signature_annotations: true
          signature_crossrefs: true
          show_root_full_path: true
          show_root_members_full_path: true
          show_symbol_type_heading: true
          show_root_heading: true
          show_root_toc_entry: true
          heading_level: 1
          check_crossrefs_exclude:
          - "^torch\\.(.*)"
          - "^numpy\\.(.*)"
          - "^lightning\\.(.*)"
        inventories:
        - https://docs.python.org/3/objects.inv
        - https://numpy.org/doc/stable/objects.inv
        - https://docs.pytorch.org/docs/stable/objects.inv
        - https://docs.jax.dev/en/latest/objects.inv
        - https://radarml.github.io/abstract-dataloader/objects.inv
        - https://radarml.github.io/xwr/objects.inv
        - https://radarml.github.io/red-rover/objects.inv
        - https://lightning.ai/docs/pytorch/stable/objects.inv

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - toc:
      permalink: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - def_list
  - attr_list
  - md_in_html
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - footnotes
  - pymdownx.snippets
