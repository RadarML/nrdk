name: Run CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Fetch secrets
      uses: webfactory/ssh-agent@v0.9.0
      with:
          ssh-private-key: |
                ${{ secrets.XWR_PRIVATE_KEY }}
                ${{ secrets.RED_ROVER_PRIVATE_KEY }}

    - name: Install uv with Python 3.14
      uses: astral-sh/setup-uv@v6
      with:
        python-version: "3.14"
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    # We use a CPU-only torch in CI to skip ~2.5GB of CUDA wheels.
    # `--no-sync` below keeps `uv run` from reinstalling CUDA torch.
    - name: Install dependencies (CPU-only torch)
      run: |
        uv export --frozen --extra dev --extra roverd --no-hashes \
          -o "$RUNNER_TEMP/requirements-locked.txt"
        grep -vE '^(nvidia-|cuda-|triton==)' \
          "$RUNNER_TEMP/requirements-locked.txt" \
          > "$RUNNER_TEMP/requirements-cpu.txt"
        uv venv
        uv pip install --torch-backend=cpu \
          -r "$RUNNER_TEMP/requirements-cpu.txt"

    - name: Lint with ruff
      run: |
        uv run --no-sync ruff check ./src

    - name: Type check with pyright
      run: |
        uv run --no-sync pyright ./src

    - name: Run tests
      run: |
        uv run --no-sync pytest -ra -- tests
